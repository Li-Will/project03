name: CI

# 设计原则：**CI 结果只取决于代码**。
# 不接真实 LLM、不依赖向量索引与外部服务（测试全部注入 fake 检索器 / 临时库），
# 因此不需要任何仓库密钥，也不会因为模型下载或网络抖动而随机飘红。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QDRANT_MODE: local

jobs:
  test:
    name: 测试（离线确定性路径）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.5"
          enable-cache: true

      - name: 按 lock 安装依赖
        run: uv sync --frozen --dev

      - name: 单元测试（全量离线：fake 检索器 + 临时库）
        run: uv run pytest -q

      - name: 评测链路冒烟（mock 99 条，离线确定性 + 数字护栏）
        run: |
          set -euo pipefail
          uv run python eval/run_eval.py --mode mock | tee /tmp/mock_eval.txt
          # 数字护栏：gold set 条数与关键指标必须与代码一致
          # （防止"改了评测集忘了改标签/指标静默失效"这类没人发现的漂移）
          python - <<'PY'
          import re
          txt = open("/tmp/mock_eval.txt", encoding="utf-8").read()
          n = re.search(r"n=(\d+)", txt)
          assert n and n.group(1) == "99", f"gold set 条数异常：{txt[:200]}"
          for key in ("intent_acc=1.000", "faq_resolved=1.000", "neg_blocked=1.000",
                      "cite_hit=1.000", "esc_f1=1.0000"):
              assert key in txt, f"mock 指标异常，缺少 {key}"
          print("mock 护栏通过：99 条 + 五项指标全 1.000")
          PY

      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
          if-no-files-found: ignore

  docker:
    name: 镜像可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 会腐化 —— 让 CI 每次都真构建一次（不推送镜像）
      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ticket-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟：镜像能起服务 + 寒暄链路可用（不依赖向量索引）
        run: |
          docker run -d --name smoke -p 8000:8000 ticket-agent:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null; then
              echo "健康检查通过"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "容器未就绪"; docker logs smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          echo
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/chat \
            -H 'Content-Type: application/json' -d '{"text":"你好"}'
          echo
          echo "--- 非 root 用户（必须不是 root）---"
          who=$(docker exec smoke id -un)
          echo "$who"
          if [ "$who" = "root" ]; then echo "容器以 root 运行，不合规"; docker rm -f smoke; exit 1; fi
          docker rm -f smoke