[project]
name = "project03"
version = "0.1.0"
description = "企业客服多 Agent 工单系统（Ticket Agent）：意图路由 + FAQ 直答 + 诊断链 + 转人工 + SLA + 状态机"
readme = "README.md"
authors = [
    { name = "光亚", email = "3487574889@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite",
    "pydantic-settings>=2.15.0",
    "qdrant-client[fastembed]>=1.19.1",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
project03 = "project03:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]